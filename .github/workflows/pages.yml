name: Publicar portal no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar site estático
        run: |
          mkdir _site
          cp portal-ingles/index.html portal-ingles/styles.css portal-ingles/app.js portal-ingles/fixed-video-catalog.js portal-ingles/google-gemini-client.js portal-ingles/sw.js portal-ingles/manifest.webmanifest portal-ingles/icon-192.png portal-ingles/icon-512.png portal-ingles/.nojekyll _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
